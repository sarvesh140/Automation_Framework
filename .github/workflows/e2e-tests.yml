name: E2E Test Suite

# Manual trigger only — pick which suite to run instead of always running everything.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which suite to run'
        required: true
        type: choice
        default: all
        options:
          - all
          - api
          - ui
          - workflow

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEV_BASE_URL: ${{ secrets.DEV_BASE_URL }}
      EMAIL: ${{ secrets.EMAIL }}
      OTP: ${{ secrets.OTP }}
      HEADED: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run ${{ inputs.suite }} suite
        run: |
          case "${{ inputs.suite }}" in
            api)      npx playwright test tests/api ;;
            ui)       npx playwright test tests/ui ;;
            workflow) npx playwright test tests/workflow ;;
            *)        npx playwright test ;;
          esac

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ inputs.suite }}
          path: allure-results/
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ inputs.suite }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
